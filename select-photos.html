<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick photos · BD Pig Roast</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --card: #161310;
      --card-hover: #1e1a16;
      --line: #2e2924;
      --text: #f3ebe0;
      --muted: #a89880;
      --ember: #e07a3a;
      --ok: #6b9f5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.15rem 1rem 8rem;
    }
    header { max-width: 640px; margin: 0 auto 1rem; }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); font-size: 0.88rem; margin-top: 0.35rem; line-height: 1.45; }
    a.back { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
    a.back:hover { color: var(--ember); }
    .toolbar {
      max-width: 640px; margin: 0 auto 0.85rem;
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
    }
    .toolbar button {
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      padding: 0.4rem 0.7rem; border-radius: 8px; font-size: 0.78rem; cursor: pointer;
    }
    .toolbar button:hover { border-color: var(--ember); color: var(--ember); }
    .count { color: var(--muted); font-size: 0.82rem; margin-left: auto; }
    .count strong { color: var(--ember); }

    .list {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
    }
    .row {
      display: grid;
      grid-template-columns: 22px 2rem 56px 1fr 22px;
      gap: 0.65rem;
      align-items: center;
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--card-hover); }
    .row:has(input:checked) { background: rgba(224, 122, 58, 0.1); }
    .row input {
      width: 16px; height: 16px; accent-color: var(--ember); cursor: pointer;
    }
    .num {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      font-variant-numeric: tabular-nums; letter-spacing: 0.03em;
    }
    .row:has(input:checked) .num { color: var(--ember); }

    /* Small square icon thumbnail */
    .icon {
      width: 56px; height: 56px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      flex-shrink: 0;
      background: #0a0908;
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .icon img {
      width: 56px; height: 56px;
      object-fit: cover;
      display: block;
    }
    .row:has(input:checked) .icon {
      border-color: var(--ember);
      box-shadow: 0 0 0 1px var(--ember);
    }

    .text { min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
    .title {
      font-size: 0.84rem; line-height: 1.25; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .id { font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .check-ui {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid var(--line);
      justify-self: end;
    }
    .row:has(input:checked) .check-ui {
      background: var(--ember);
      border-color: var(--ember);
      box-shadow: inset 0 0 0 3px var(--bg);
    }

    .bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(12,11,10,0.95);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(10px);
      padding: 0.8rem 1rem; z-index: 10;
    }
    .bar-inner {
      max-width: 640px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: flex-start;
    }
    .bar textarea {
      flex: 1 1 240px; min-height: 3rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text); padding: 0.45rem 0.6rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem; resize: vertical;
    }
    .bar .actions { display: flex; flex-direction: column; gap: 0.35rem; }
    .bar .actions button {
      background: var(--ember); color: #fff; border: none; border-radius: 8px;
      padding: 0.5rem 0.9rem; font-weight: 600; font-size: 0.82rem; cursor: pointer;
      white-space: nowrap;
    }
    .bar .actions button.secondary {
      background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500;
    }
    .toast {
      position: fixed; top: 1rem; right: 1rem;
      background: var(--ok); color: #fff; padding: 0.45rem 0.85rem;
      border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 420px) {
      .row { grid-template-columns: 18px 1.6rem 48px 1fr 18px; gap: 0.45rem; padding: 0.45rem 0.55rem; }
      .icon, .icon img { width: 48px; height: 48px; }
    }
  </style>
</head>

  <div class="bar">
    <div class="bar-inner">
      <textarea id="out" readonly placeholder="Selected photo numbers / IDs appear here…"></textarea>
      <div class="actions">
        <button type="button" id="copy">Copy selection</button>
        <button type="button" class="secondary" id="copyNums">Copy numbers only</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Copied</div>

  <script>
    const peopleHeavy = new Set([
      '29022093694','29613301276','20509335968','20509401620','20076491723',
      '20687426522','19989443734','20703377031','20510511489','14972419791',
      '20670644226','14939734955'
    ]);
    const form = document.getElementById('form');
    const out = document.getElementById('out');
    const nEl = document.getElementById('n');
    const toast = document.getElementById('toast');

    function sync() {
      const boxes = [...form.querySelectorAll('input[type=checkbox]')];
      const selected = boxes.filter(b => b.checked);
      nEl.textContent = selected.length;
      out.value = selected.map(b => {
        const num = b.closest('.row').querySelector('.num').textContent;
        return num + '  ' + b.value + '  ' + b.dataset.title;
      }).join('\n');
      out.dataset.nums = selected.map(b => b.closest('.row').querySelector('.num').textContent).join(', ');
    }

    form.addEventListener('change', sync);
    form.addEventListener('click', (e) => {
      const row = e.target.closest('.row');
      if (!row || e.target.matches('input')) return;
      const input = row.querySelector('input');
      input.checked = !input.checked;
      sync();
    });

    document.getElementById('all').onclick = () => {
      form.querySelectorAll('input').forEach(b => b.checked = true); sync();
    };
    document.getElementById('none').onclick = () => {
      form.querySelectorAll('input').forEach(b => b.checked = false); sync();
    };
    document.getElementById('people').onclick = () => {
      form.querySelectorAll('input').forEach(b => { b.checked = peopleHeavy.has(b.value); });
      sync();
    };

    function flash() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    }
    document.getElementById('copy').onclick = async () => {
      await navigator.clipboard.writeText(out.value || ''); flash();
    };
    document.getElementById('copyNums').onclick = async () => {
      await navigator.clipboard.writeText(out.dataset.nums || ''); flash();
    };
    sync();
  </script>
