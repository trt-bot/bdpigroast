<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick photos · BD Pig Roast</title>
  <style>
    :root {
      --bg: #0c0b0a;
      --card: #1a1714;
      --line: #2e2924;
      --text: #f3ebe0;
      --muted: #a89880;
      --ember: #e07a3a;
      --ember-dim: #c45c22;
      --ok: #6b9f5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem 1rem 7rem;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 1.25rem;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
      line-height: 1.45;
    }
    .toolbar {
      max-width: 1100px;
      margin: 0 auto 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .toolbar button {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toolbar button:hover { border-color: var(--ember); color: var(--ember); }
    .count {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: auto;
    }
    .count strong { color: var(--ember); }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.65rem;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      user-select: none;
    }
    .card:hover { border-color: #4a4036; transform: translateY(-1px); }
    .card:has(input:checked) {
      border-color: var(--ember);
      box-shadow: 0 0 0 1px var(--ember);
    }
    .card input {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 18px;
      height: 18px;
      z-index: 2;
      accent-color: var(--ember);
      cursor: pointer;
    }
    .card .num {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .card .meta {
      padding: 0.45rem 0.5rem 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-height: 2.8rem;
    }
    .card .title {
      font-size: 0.68rem;
      line-height: 1.25;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .id {
      font-size: 0.6rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(12,11,10,0.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(10px);
      padding: 0.85rem 1rem;
      z-index: 10;
    }
    .bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: flex-start;
    }
    .bar textarea {
      flex: 1 1 280px;
      min-height: 3.2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.65rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      resize: vertical;
    }
    .bar .actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .bar .actions button {
      background: var(--ember);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .bar .actions button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 500;
    }
    .bar .actions button:hover { filter: brightness(1.08); }
    .toast {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--ok);
      color: #fff;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    a.back {
      color: var(--muted);
      font-size: 0.8rem;
      text-decoration: none;
    }
    a.back:hover { color: var(--ember); }
  </style>
</head>

  <script>
    const peopleHeavy = new Set([
      '29022093694','29613301276','20509335968','20509401620','20076491723',
      '20687426522','19989443734','20703377031','20510511489','14972419791',
      '20670644226','14939734955'
    ]);
    const form = document.getElementById('form');
    const out = document.getElementById('out');
    const nEl = document.getElementById('n');
    const toast = document.getElementById('toast');

    function sync() {
      const boxes = [...form.querySelectorAll('input[type=checkbox]')];
      const selected = boxes.filter(b => b.checked);
      nEl.textContent = selected.length;
      const lines = selected.map((b, i) => {
        const card = b.closest('.card');
        const num = card.querySelector('.num').textContent;
        return num + '  ' + b.value + '  ' + b.dataset.title;
      });
      out.value = lines.join('\n');
      out.dataset.nums = selected.map(b => b.closest('.card').querySelector('.num').textContent).join(', ');
    }

    form.addEventListener('change', sync);
    // click whole card toggles (except when clicking checkbox directly - still ok)
    form.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card || e.target.matches('input')) return;
      const input = card.querySelector('input');
      input.checked = !input.checked;
      sync();
    });

    document.getElementById('all').onclick = () => {
      form.querySelectorAll('input').forEach(b => b.checked = true); sync();
    };
    document.getElementById('none').onclick = () => {
      form.querySelectorAll('input').forEach(b => b.checked = false); sync();
    };
    document.getElementById('people').onclick = () => {
      form.querySelectorAll('input').forEach(b => {
        b.checked = peopleHeavy.has(b.value);
      });
      sync();
    };

    function flash() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    }
    document.getElementById('copy').onclick = async () => {
      await navigator.clipboard.writeText(out.value || '');
      flash();
    };
    document.getElementById('copyNums').onclick = async () => {
      await navigator.clipboard.writeText(out.dataset.nums || '');
      flash();
    };
    sync();
  </script>
</body>
</html>
